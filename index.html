<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSLSK Division-9 Database</title>

    <!-- Inline critical styles: prevents a flash of default (grey/monochrome)
         browser styling before style.css finishes loading -->
    <style>
        html, body {
            background:#020503;
            margin:0;
            padding:0;
        }

        #terminal {
            visibility: hidden;
        }
    </style>

    <link rel="stylesheet" href="style.css?v=2">
</head>
<body>

    <!-- CRT Overlay -->
    <div id="crt-overlay"></div>

    <!-- Idle Banner (appears after ~5min idle with a cleared screen) -->
    <div id="idle-banner"><pre id="idle-banner-text"></pre></div>

    <!-- Terminal -->
    <main id="terminal">

        <!-- Scanline Overlay (moving green sweep, old-monitor style).
             Lives inside #terminal now (not a full-page sibling) so
             the sweep is clipped to the box itself instead of
             bleeding across the whole viewport. -->
        <div id="scanline-overlay"></div>

        <!-- Header -->
        <header id="terminal-header">
            <span class="status">BSLSK DIVISION-9</span>
            <span class="divider">|</span>
            <span class="status">DATABASE TERMINAL</span>
            <span class="divider">|</span>
            <span id="connection-status">OFFLINE</span>
        </header>

        <!-- Output -->
        <section id="terminal-output"></section>

        <!-- Input -->
        <footer id="terminal-input">

            <span id="prompt">
                >
            </span>

            <input
                id="command-input"
                type="text"
                autocomplete="off"
                spellcheck="false"
                autofocus
            />

            <span class="cursor" id="input-cursor"></span>

            <span id="tab-hint"></span>

        </footer>

    </main>

    <!-- Hidden audio (src is set from terminal.js) -->
    <audio id="startup" preload="auto"></audio>
    <audio id="keypress" preload="auto"></audio>
    <audio id="error" preload="auto"></audio>
    <audio id="loginerror" preload="auto"></audio>
    <audio id="ambience" preload="auto"></audio>
    <audio id="loginsuccess" preload="auto"></audio>
    <audio id="success" preload="auto"></audio>
    <audio id="idle" preload="auto"></audio>

    <!-- Scripts -->
    <script src="database.js?v=7"></script>
    <script src="terminal.js?v=8"></script>
    <script src="blackjack.js?v=2"></script>

</body>
</html>
